# XcodeGen spec — run `xcodegen generate` in this directory to produce
# Arabesque.xcodeproj (not committed, see .gitignore).
name: Arabesque
options:
  bundleIdPrefix: com.arabesque
  deploymentTarget:
    iOS: '15.0'
targets:
  Arabesque:
    type: application
    platform: iOS
    sources:
      - path: Arabesque
        excludes:
          - Resources
      - path: Arabesque/Resources/webmidi-shim.js
        buildPhase: resources
    info:
      path: Arabesque/Info.plist
      properties:
        CFBundleDisplayName: Arabesque
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Declares that the app uses no encryption beyond the exempt kind (it
        # only talks HTTPS). Without it App Store Connect asks on every upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: Arabesque.SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: >-
          Arabesque se connecte aux claviers MIDI Bluetooth pour suivre ce
          que vous jouez.
        # Dev convenience: allows pointing PTWebAppURL at a local
        # (non-HTTPS) instance of the app, e.g. http://mac.local:4567
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: >-
          Accès au réseau local uniquement pour le développement, quand l'app
          charge une instance locale d'Arabesque.
        # URL loaded by the WKWebView
        PTWebAppURL: https://arabesque.app/
    settings:
      base:
        TARGETED_DEVICE_FAMILY: 1,2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Version shown to users; bump by hand for a release.
        MARKETING_VERSION: '1.0'
        # Build number: must be unique for every upload to App Store Connect.
        CURRENT_PROJECT_VERSION: '1'
        SUPPORTS_MACCATALYST: false
