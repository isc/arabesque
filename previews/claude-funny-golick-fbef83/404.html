<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="app-version" content="3d3053c86a6f" />
    <!-- GitHub Pages answers every path it has no file for with this page, at
         that path: what it loads is found from the site's root, at any depth. -->
    <base href="/" />
    <title>Arabesque</title>
    <!-- preloads: written at deploy by scripts/preload-modules.mjs -->
    <link rel="modulepreload" href="js/errorLog.js?v=3d3053c86a6f" />
    <link rel="modulepreload" href="js/i18n.js?v=3d3053c86a6f" />
    <link rel="modulepreload" href="js/locales/fr.js?v=3d3053c86a6f" />
    <link rel="modulepreload" href="js/locales/en.js?v=3d3053c86a6f" />
    <link rel="modulepreload" href="js/legacyKeys.js?v=3d3053c86a6f" />
    <!-- /preloads -->
    <script type="module" src="js/errorLog.js?v=3d3053c86a6f"></script>
    <script>
      // A page of a preview gone with its pull request, typically under a
      // player who was trying it in the iOS app, which has no address bar to
      // leave by: on to the same page in production, which now carries the
      // change or never will. replace(), so that Back does not come here again;
      // ahead of the stylesheet, which would hold it up.
      const gone = location.pathname.match(/^\/previews\/[^/]+\/(.*)$/)
      if (gone) location.replace(`/${gone[1]}${location.search}${location.hash}`)
    </script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=3d3053c86a6f" />
    <script type="module" src="js/version.js"></script>
    <script type="module">
      import { initI18n } from './js/i18n.js?v=3d3053c86a6f'
      initI18n()
    </script>
  </head>
  <body>
    <main class="container pt-prose">
      <h1 data-i18n="notFound.heading">Page introuvable</h1>
      <p><a href="library.html" data-i18n="common.openLibrary">Ouvrir la bibliothèque</a></p>
    </main>
  </body>
</html>
