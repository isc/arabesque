name: Cleanup branch preview

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

# Same group as deploy-pages.yml and preview.yml, queued: see there.
concurrency:
  group: gh-pages
  cancel-in-progress: false
  queue: max

jobs:
  delete-preview:
    runs-on: ubuntu-latest
    steps:
      # The rule preview.yml published by, from the base branch: gh-pages,
      # checked out below, carries no scripts.
      - name: Checkout the slug script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: tools
          sparse-checkout: scripts

      # Through env, never pasted into the script: the branch name is the
      # pull request author's to choose.
      - name: Compute preview slug
        id: slug
        # On a line of its own: inside the echo, a failing script would leave
        # the slug empty, and the step below remove previews/ whole.
        run: |
          slug=$(tools/scripts/preview-slug.sh "$BRANCH")
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
        env:
          BRANCH: ${{ github.head_ref }}

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove preview directory
        working-directory: site
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          dir="previews/${SLUG:?}"
          if [ -d "$dir" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git rm -rfq "$dir"
            git commit -qm "cleanup: remove preview ${{ steps.slug.outputs.slug }}"
            git push origin gh-pages
          else
            echo "No preview directory at $dir, nothing to clean."
          fi

      - name: Update PR comment
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: marocchino/sticky-pull-request-comment@v2
          attempt_limit: 3
          attempt_delay: 10000
          with: |
            header: preview-${{ steps.slug.outputs.slug }}
            message: |
              _Preview supprimée_ (PR fermée). L'URL n'est plus accessible.
