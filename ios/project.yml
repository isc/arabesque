# XcodeGen spec — run `xcodegen generate` in this directory to produce
# Arabesque.xcodeproj (not committed, see .gitignore).
name: Arabesque
options:
  bundleIdPrefix: app.arabesque
  deploymentTarget:
    iOS: '15.0'
targets:
  Arabesque:
    type: application
    platform: iOS
    sources:
      - path: Arabesque
        excludes:
          - Resources
      - path: Arabesque/Resources/webmidi-shim.js
        buildPhase: resources
    info:
      path: Arabesque/Info.plist
      properties:
        CFBundleDisplayName: Arabesque
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Declares that the app uses no encryption beyond the exempt kind (it
        # only talks HTTPS). Without it App Store Connect asks on every upload.
        ITSAppUsesNonExemptEncryption: false
        # Opting in is what lets the webview run service workers, which is the
        # only way the web app can work offline (see README, "App-bound
        # domains"). It is not free: declaring this key denies script
        # injection, style sheets, cookie manipulation and message handlers on
        # every WKWebView in the app, and ViewController restores them by
        # setting limitsNavigationsToAppBoundDomains. Both halves are needed —
        # the MIDI bridge is an injected script plus a message handler.
        WKAppBoundDomains:
          - arabesque.app
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: Arabesque.SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: >-
          Arabesque se connecte aux claviers MIDI Bluetooth pour suivre ce
          que vous jouez.
        # Dev convenience: allows pointing PTWebAppURL at a local
        # (non-HTTPS) instance of the app, e.g. http://mac.local:4567
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: >-
          Accès au réseau local uniquement pour le développement, quand l'app
          charge une instance locale d'Arabesque.
        # URL loaded by the WKWebView
        PTWebAppURL: https://arabesque.app/
    # `xcodebuild archive` works on schemes, not targets, so the release
    # workflow needs one committed rather than left to Xcode's autocreation.
    scheme: {}
    settings:
      base:
        TARGETED_DEVICE_FAMILY: 1,2
        # Not a secret: a Team ID is readable from any distributed app bundle.
        # Committing it means `xcodegen generate` stops wiping the team chosen
        # in Xcode, which it otherwise does on every regeneration.
        DEVELOPMENT_TEAM: HGPUW9Q6BQ
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Version shown to users; bump by hand for a release.
        MARKETING_VERSION: '1.0'
        # Build number: must be unique for every upload to App Store Connect.
        CURRENT_PROJECT_VERSION: '1'
        SUPPORTS_MACCATALYST: false
